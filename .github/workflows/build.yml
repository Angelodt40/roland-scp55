name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    name: compile on ${{ matrix.container }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: debian:bookworm
            family: debian
          - container: debian:trixie
            family: debian
          - container: fedora:latest
            family: fedora
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          if [ "${{ matrix.family }}" = "debian" ]; then
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends build-essential linux-headers-amd64 >/dev/null
          else
            dnf install -y -q make gcc elfutils-libelf-devel kernel-devel kernel-headers >/dev/null
          fi

      - name: Build module
        run: |
          if [ "${{ matrix.family }}" = "debian" ]; then
            KDIR=$(ls -d /usr/src/linux-headers-*-amd64 | tail -1)
          else
            KDIR=$(ls -d /usr/src/kernels/* | tail -1)
          fi
          echo "building against $KDIR"
          make -C src KDIR="$KDIR"
          test -f src/scp55.ko

  package:
    name: build .deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build dkms package
        run: bash packaging/make-deb.sh

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
